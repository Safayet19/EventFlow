spring.application.name=eventflow

# Render provides PORT automatically. Local development falls back to 8080.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.whitelabel.enabled=false

# MongoDB Atlas. MONGODB_URI must be supplied as an environment variable.
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:eventflow}
spring.data.mongodb.auto-index-creation=true

# Public demo accounts are seeded automatically by DataInitializer.
# Their credentials are intentionally shown on the login page for this university/demo project.
eventflow.security.remember-key=${EVENTFLOW_REMEMBER_KEY:eventflow-local-remember-key}

# Keep false while developing. Set THYMELEAF_CACHE=true on deployment for faster template rendering.
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Small in-memory cache for event lists and repeated registration counts.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=300,expireAfterWrite=2m

# Compress text responses sent to the browser.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml

# Let the browser reuse CSS, JavaScript, icons and other static files.
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.cache=true

# Uploaded event images are kept separately in MongoDB so event-list queries stay lightweight.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

