<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventFlow | Manage Users</title>
    <link rel="icon" type="image/png" th:href="@{/images/eventflow-favicon.png(v='20260923ui6')}" href="/images/eventflow-favicon.png?v=20260923ui6">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/site.css(v=20261011clean)}" href="/css/site.css?v=20261011clean">
    <link rel="stylesheet" th:href="@{/css/workspace-final.css(v=20261011full)}" href="/css/workspace-final.css?v=20261011full">
</head>
<body class="ef-workspace">
<div th:replace="~{fragments :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments :: sidebar('users')}"></div>
    <main class="app-main">
        <section class="page-heading">
            <div>
                <span class="section-kicker">ADMIN CONTROL</span>
                <h1>User Management</h1>
                <p>Manage user accounts, roles and account status.</p>
            </div>
        </section>

        <section class="table-card">
            <div class="table-toolbar">
                <div class="table-search"><i class="bi bi-search"></i><input id="userSearch" type="search" placeholder="Search by name or email..."></div>
                <select id="roleFilter" class="toolbar-select"><option value="ALL">All roles</option><option value="ADMIN">Admin</option><option value="ORGANIZER">Organizer</option><option value="PARTICIPANT">Participant</option></select>
                <select id="statusFilter" class="toolbar-select"><option value="ALL">All status</option><option value="ACTIVE">Active</option><option value="DISABLED">Disabled</option></select>
                <div class="table-count" id="userCount" th:text="${#lists.size(users) + ' users'}">0 users</div>
            </div>
            <div class="data-table-wrap">
                <table class="data-table" id="userTable">
                    <thead><tr><th>User</th><th>Role</th><th>Status</th><th class="actions-column">Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="member : ${users}"
                        th:attr="data-name=${member.fullName},data-email=${member.email},data-role=${member.role},data-status=${member.enabled ? 'ACTIVE' : 'DISABLED'}">
                        <td>
                            <div class="table-user">
                                <img loading="lazy" class="avatar avatar-image" th:src="${member.profileImageUrl != null ? member.profileImageUrl : '/images/default-avatar.png'}" src="/images/default-avatar.png" alt="Profile picture">
                                <div>
                                    <strong th:text="${member.fullName}">User</strong>
                                    <small th:text="${member.email}">email</small>
                                    <span class="protected-chip" th:if="${@display.demoAccount(member)}"><i class="bi bi-shield-lock-fill"></i> Demo · Protected</span>
                                </div>
                            </div>
                        </td>
                        <td><span class="role-chip" th:text="${member.role}">ROLE</span></td>
                        <td><span class="status-badge" th:classappend="${member.enabled} ? ' success-status' : ' danger-status'" th:text="${member.enabled ? 'ACTIVE' : 'DISABLED'}">ACTIVE</span></td>
                        <td class="action-cell">
                            <th:block th:if="${!(@display.demoAccount(member)) and member.id != currentUser.id}">
                                <form class="role-form confirm-form" data-loading th:action="@{'/admin/users/' + ${member.id} + '/role'}" method="post"
                                      th:attr="data-confirm-title='Change role for ' + ${member.fullName} + '?',data-confirm='This will change the account access level.',data-confirm-action='Change Role'">
                                    <select name="role" aria-label="Change role">
                                        <option value="PARTICIPANT" th:selected="${member.role == 'PARTICIPANT'}">Participant</option>
                                        <option value="ORGANIZER" th:selected="${member.role == 'ORGANIZER'}">Organizer</option>
                                        <option value="ADMIN" th:selected="${member.role == 'ADMIN'}">Admin</option>
                                    </select>
                                    <button class="small-action-button" type="submit" title="Update role"><i class="bi bi-check2"></i></button>
                                </form>
                                <form class="inline-form confirm-form" data-loading th:action="@{'/admin/users/' + ${member.id} + '/toggle'}" method="post"
                                      th:attr="data-confirm-title=${member.enabled ? 'Disable ' + member.fullName + '?' : 'Enable ' + member.fullName + '?'},data-confirm=${member.enabled ? 'This user will not be able to sign in until enabled again.' : 'This user will be able to sign in again.'},data-confirm-action=${member.enabled ? 'Disable' : 'Enable'}">
                                    <button class="small-action-button" type="submit" th:title="${member.enabled ? 'Disable user' : 'Enable user'}"><i th:class="${member.enabled ? 'bi bi-person-slash' : 'bi bi-person-check'}"></i></button>
                                </form>
                                <form class="inline-form confirm-form" th:action="@{'/admin/users/' + ${member.id} + '/delete'}" method="post"
                                      th:attr="data-confirm-title='Delete ' + ${member.fullName} + '?',data-confirm='This removes the user and related data. This cannot be undone.',data-confirm-action='Delete User'">
                                    <button class="small-action-button danger-action" type="submit" title="Delete user"><i class="bi bi-trash3"></i></button>
                                </form>
                            </th:block>
                            <span class="protected-label" th:if="${@display.demoAccount(member)}"><i class="bi bi-lock-fill"></i> Protected</span>
                            <span class="self-label" th:if="${!(@display.demoAccount(member)) and member.id == currentUser.id}">Current admin</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="ef-user-table-footer">
                <span id="userRange" aria-live="polite"></span>
                <nav id="userPagination" class="ef-user-pagination" aria-label="User list pages"></nav>
            </div>
            <div class="clean-empty filtered-empty" id="userEmpty"><i class="bi bi-search"></i><h3>No matching users</h3><p>Try a different search or role filter.</p></div>
        </section>
    </main>
</div>
<div th:replace="~{fragments :: toasts}"></div>
<script th:src="@{/js/site.js(v='20261011clean')}" src="/js/site.js?v=20261011clean"></script>

<script th:src="@{/js/workspace-final.js(v=20261011clean)}" src="/js/workspace-final.js?v=20261011clean" defer></script>
</body>
</html>
