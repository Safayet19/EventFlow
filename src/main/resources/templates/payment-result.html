<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Result | EventFlow</title>
<link rel="icon" type="image/png" th:href="@{/images/eventflow-favicon.png}" href="/images/eventflow-favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/site.css(v=20261011tickets)}" href="/css/site.css">
<link rel="stylesheet" th:href="@{/css/public.css(v=20261010v1)}" href="/css/public.css">
<link rel="stylesheet" th:href="@{/css/v1-public.css(v=20261011pay)}" href="/css/v1-public.css">
<link rel="stylesheet" th:href="@{/css/payment.css(v=20261011tickets)}" href="/css/payment.css">
</head>
<body class="v1-page ef-payment-page">
<div th:replace="~{fragments :: v1Nav('events')}"></div>
<main class="ef-checkout-wrap">
 <section class="ef-checkout-card ef-result-card" th:with="paid=${attempt.status == 'PAID'}">
   <div th:class="${paid ? 'ef-result-icon ef-result-ok' : 'ef-result-icon ef-result-wait'}"><i th:class="${paid ? 'bi bi-check-circle' : 'bi bi-exclamation-circle'}"></i></div>
   <h1 th:text="${paid ? 'Registration Confirmed' : 'Registration Not Confirmed'}">Payment status</h1>
   <p th:if="${paid}">Your ticket is confirmed.</p>
   <p th:if="${!paid}">Your registration was not completed.</p>
   <div class="ef-result-facts"><div><span>Event</span><strong th:text="${event != null ? event.title : 'Event'}">Event</strong></div>
     <div><span>Ticket</span><strong th:text="${attempt.ticketTypeName}">Standard</strong></div>
     <div><span>Amount</span><strong th:text="${'৳' + attempt.payableAmount}">৳800</strong></div>
     <div><span>Status</span><strong th:text="${attempt.status}">PENDING</strong></div>
     <div><span>Reference</span><strong class="ef-ref" th:text="${attempt.transactionId}">Reference</strong></div>
   </div>
   <div class="ef-result-actions"><a th:href="@{/participant/registrations}" class="ef-pay-submit">My Registrations</a>
     <a th:if="${paid and registrationId != null}" class="ef-result-download" th:href="@{'/participant/registrations/' + ${registrationId} + '/ticket.pdf'}"><i class="bi bi-download"></i> Download Ticket</a>
     <a th:if="${paid and registrationId != null}" class="ef-result-download" th:href="@{'/participant/registrations/' + ${registrationId} + '/receipt.pdf'}"><i class="bi bi-receipt"></i> Download Receipt</a>
     <a th:if="${!paid}" th:href="@{'/events/' + ${attempt.eventId} + '#tickets'}" class="ef-checkout-back">Back to event</a></div>
 </section>
</main>
<div th:replace="~{fragments :: publicFooter}"></div>
<div th:replace="~{fragments :: toasts}"></div>
<script th:src="@{/js/site.js(v=20260923fullfix1)}" src="/js/site.js" defer></script>
</body>
</html>
